---
name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=${GITHUB_REF#refs/tags/}
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  # Flatpak disabled in CI/CD - use local build (scripts/build-flatpak-local.sh)
  # Too many dependency resolution issues in GitHub Actions
  # build-flatpak:
  #   needs: setup
  #   uses: ./.github/workflows/build-flatpak-native.yml
  #   with:
  #     ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows:
    needs: setup
    uses: ./.github/workflows/build-windows.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  create-release:
    needs: [setup, build-appimage, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImage Artifact
        uses: actions/download-artifact@v6
        with:
          name: StreamLight-LinuxAppImage-${{ needs.setup.outputs.ci_version }}
          path: ./artifacts/

      # - name: Download Flatpak Artifact
      #   uses: actions/download-artifact@v6
      #   with:
      #     name: StreamLight-Flatpak-${{ needs.setup.outputs.ci_version }}
      #     path: ./artifacts/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v6
        with:
          name: StreamLight-Windows-${{ needs.setup.outputs.ci_version }}
          path: ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup.outputs.ci_version }}
          generate_release_notes: true
          files: |
            artifacts/StreamLight-${{ needs.setup.outputs.ci_version }}-x86_64.AppImage
            artifacts/StreamLight-${{ needs.setup.outputs.ci_version }}-Windows-x64.zip
